team: your-team
description: Reviewed team rules and knowledge
repo: https://github.com/YOUR-ORG/YOUR-TEAM-REPO
provider: github
autoUpdate: false
# 利用統計（スキル利用回数、割り込み・拒否・失敗の回数、トークン量）のチームリポジトリへの push を止める。teamai-cli 0.24.0 以降で有効。
# 0.23 以前では未知のキーとして無視され、セッション開始ごとの push は続く。
usageReport: false
sharing:
  recall:
    enabled: false
  # 共有の案内（/teamai-share-learnings を促す Stop Hook の出力）だけを止める。teamai-cli 0.23.0-beta.8 以降で有効。
  # 0.22.0 以前では未知のキーとして無視され、案内は出続ける（止めるには hooks/hooks.yaml の builtin.disabled）。
  contributeHint:
    enabled: false
  hooks:
    autoApply: false
  mcp:
    autoApply: false
  env:
    injectShellProfile: false
