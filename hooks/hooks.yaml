# チームが配布する Hook と、TeamAI 内蔵 Hook の上書き。
# `teamai pull` で各メンバーの AI ツールへ反映される（sharing.hooks.autoApply が false なら `teamai hooks inject` で手動反映）。
hooks: []

builtin:
  # 共有の案内だけを止めるには teamai.yaml の sharing.contributeHint.enabled: false を使う（teamai-cli 0.23.0-beta.8 以降。このテンプレートの既定）。
  # 0.22 以前で案内を止めるには内蔵 Stop Hook ごと外すしかなく、下の1行を有効にする。
  # 内蔵 Stop Hook は「共有の案内」だけでなく CLI の更新確認・recall 投票の同期・ダッシュボード報告も担うため、それらも止まる（docs/coexistence.md を参照）。
  disabled: []
  # disabled: ["Hook dispatch stop"]
  overrides: {}
