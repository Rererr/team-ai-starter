name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 0.22.0 は確認当時の npm の latest。0.23.0-beta.8 は sharing.contributeHint.enabled と日本語の訂正キーワードを含む最初の版。
        # 0.24.0 は usageReport: false（利用統計の停止）を含む最初の安定版
        teamai: ["0.22.0", "0.23.0-beta.8", "0.24.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm install -g teamai-cli@${{ matrix.teamai }}
      - run: python3 scripts/e2e-local.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
